# Configuração do Worker. Sem id de conta aqui de propósito: a conta entra na hora do deploy
# (`npx wrangler login`), nunca no git.
name = "sofaly-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false   # só pelo domínio próprio (rota abaixo)

routes = [{ pattern = "api.sofaly.tv", custom_domain = true }]

[vars]
DISABLED = "0"   # "1" desliga tudo (as TVs seguem funcionando em casa e avisam o que ficou indisponível)

# Previews (cada PR fora da main, Workers Builds roda `npx wrangler preview`): sem este bloco o build do PR falhava.
# DISABLED = "1": a versão de preview responde 503 em tudo e nunca toca nos Durable Objects nem nos limites de produção.
[previews.vars]
DISABLED = "1"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "Pairing"

# SQLite nos Durable Objects: único tipo aceito no plano grátis.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Pairing"]

# Limites da previsão do tempo (src/weather.js). Rate Limiting dos Workers: contadores por borda, period 10 ou 60 s.
# Por IP: uma TV pede no máximo umas poucas vezes por hora; 30/min sobra para uma casa com várias TVs atrás do mesmo IP.
[[ratelimits]]
name = "WEATHER_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Chamadas à WeatherAPI (fora do cache), todas as TVs juntas: 20/min ~ 864 mil/mês, abaixo do 1 milhão/mês do plano Free.
[[ratelimits]]
name = "WEATHER_UPSTREAM_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Busca e "em alta" de podcasts (src/podcasts.js). Por IP: a TV pede poucas vezes por minuto (digitar a busca).
[[ratelimits]]
name = "PODCASTS_IP_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# Chamadas ao Podcast Index (fora do cache), todas as TVs juntas.
[[ratelimits]]
name = "PODCASTS_UPSTREAM_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }
