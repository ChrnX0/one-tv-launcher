# 6 GB (18/11/2026): com 3 GB o packageRelease do "Build e Release" caiu 2x por OutOfMemoryError (R8 + empacotar as 2
# ABIs + o app do celular na mesma JVM, sem daemon). O executor ubuntu-latest tem 16 GB.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
