# Compila o launcher no GitHub e publica o APK em "Releases" (04/11/2026; publicação separada do merge em 09/11/2026).
# As TVs com a chave pública baixam daqui sozinhas (Atualizador.kt).
#
# - Pull request: só compila, para conferir que o build passa. Nunca assina com a chave de verdade nem publica.
# - Merge/push na main: NÃO compila nem publica (09/11/2026, pedido do dono). Antes, todo push na main virava Release e
#   ia direto para todas as TVs: um merge errado (ou uma conta invadida) chegava em todo mundo, com poder de Device Owner.
#   Também economiza créditos do Actions.
# - Publicar para todos = decisão à parte: Actions > "Build e Release" > "Run workflow" na main (workflow_dispatch).
#   Compila, assina com o segredo ASSINATURA_KEYSTORE_B64 e publica um Release com o APK e o SHA-256.
#   Rodado em outra branch, só compila e assina com a chave debug do runner: a chave de verdade só é lida na main
#   (10/11/2026, auditoria: antes uma branch qualquer saía assinada com a chave aceita pelas TVs, como artifact).
#   Sem o segredo, só compila (e avisa).
#   Antes de publicar roda os testes JVM (14/11/2026, ideia 62a): teste vermelho = nada sai.
# - Elevação 21.1 (17/11/2026): os testes JVM rodam também em TODO PR (antes só compilava): o erro aparece no PR, não
#   na hora do Release. Custo medido: ~1 min 50 s a mais por PR (docs/ci-minutos.md). Em troca, um push novo no mesmo
#   PR cancela a execução anterior (concurrency abaixo), que não serve mais para nada.
# - Canal (14/11/2026, ideia 62c): "teste" publica como pré-lançamento (prerelease). O /releases/latest do GitHub ignora
#   pré-lançamentos, então só a TV com o canal de teste ligado (ComandosExtras "canal") instala. Depois de uns dias sem
#   queda na TV de teste, o workflow "Promover para todos" (promover.yml) tira a marca e todas as TVs recebem.
# - Republicar (14/11/2026, ideia 62b): o campo "commit" recompila um commit ANTIGO da main. O versionCode vem da hora da
#   compilação, então sai MAIOR que a versão ruim e as TVs aceitam por cima (o Android não deixa voltar versão). Risco:
#   o código antigo precisa ler o que a versão nova gravou (preferências, banco); confira o que mudou entre os dois.
#   Commit de antes de 19/11/2026 não serve mais: ele sai com o pacote antigo e a conferência de pacote abaixo para.
# - Pacote (19/11/2026, decisão do Paulo): o app é tv.sofaly.launcher (sofaly-launcher*.apk). "bridge" publica junto a
#   PONTE br.paulo.tvlauncher (one-tv-launcher*.apk), que as TVs ainda no pacote antigo instalam e que passa o Device
#   Owner e os ajustes para o app novo (PackageMigration.kt). Sem TV no pacote antigo, rode sem "bridge".
#
# Segredo necessário (Settings > Secrets and variables > Actions): ASSINATURA_KEYSTORE_B64 = a chave PÚBLICA do
# projeto em base64 (+ ASSINATURA_SENHA / ASSINATURA_ALIAS se não forem os padrões). NUNCA o debug.keystore do PC de build:
# decisão do dono (04/11/2026, opção A) — quem tivesse uma chave aceita pela TV poderia assinar uma "atualização"
# por cima do Device Owner.
name: Build e Release

on:
  pull_request:
    paths-ignore: ['server/**', '.github/workflows/server.yml']   # o servidor tem o próprio teste
  workflow_dispatch:   # publicar: rodar à mão na main (ver o topo)
    inputs:
      canal:
        description: 'todos = todas as TVs; teste = pré-lançamento, só a TV com o canal de teste'
        type: choice
        options: [todos, teste]
        default: todos
      commit:
        description: 'Republicar: commit antigo da main para recompilar (vazio = a ponta da main)'
        type: string
        default: ''
      bridge:
        description: 'Também a ponte br.paulo.tvlauncher (one-tv-launcher*.apk): só enquanto houver TV no pacote antigo'
        type: boolean
        default: false

# Mínimo para todos (PR inclusive): só ler. Só o job "publicar" (main, à mão) ganha a escrita para criar o Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # PR: o push novo cancela o anterior (economia). Publicar (main, à mão): nunca cancela no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # 17/11/2026: a chave de assinatura e as chaves dos serviços ficam no Environment "publicar" (só main + aprovação do
    # Paulo), não nos segredos do repositório: um workflow alterado numa branch não consegue lê-las. PR = sem Environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'publicar' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      codigo: ${{ steps.info.outputs.codigo }}
      nome: ${{ steps.info.outputs.nome }}
      tem_chave: ${{ steps.chave.outputs.tem_chave }}
      commit: ${{ steps.info.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # o token não fica gravado no .git: os passos do build não precisam dele
          fetch-depth: 0               # republicar: precisa do histórico para conferir que o commit é da main

      # Republicar (62b): só commit que já está na main. O input não entra direto no shell (vai por env).
      - name: Commit a republicar
        if: github.event_name == 'workflow_dispatch' && inputs.commit != ''
        env:
          ALVO: ${{ inputs.commit }}
        run: |
          if ! printf '%s' "$ALVO" | grep -Eq '^[0-9a-f]{7,40}$'; then echo "::error::commit inválido: use o hash"; exit 1; fi
          # Sem "git fetch" aqui: o fetch-depth 0 já trouxe a origin/main, e com persist-credentials false um fetch
          # falharia quando o repo do código for privado.
          if ! git merge-base --is-ancestor "$ALVO" origin/main; then echo "::error::$ALVO não está na main"; exit 1; fi
          git checkout --detach "$ALVO"
          echo "Republicando $(git log -1 --format='%h %s' HEAD)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # O runner já traz o Android SDK em $ANDROID_HOME (o setup-android@v3 quebrava ao pedir o pacote "tools", que
      # não existe mais). Só faltam as mesmas versões do PC de build: SDK 36 (NDK e CMake eram da librish.so do Shizuku
      # embutido, que saiu em 12/11/2026).
      - name: Componentes do Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      # Go para o túnel do Tailscale (tunel/, vira libtsnet.so dentro do APK; ver compilarTunel em app/build.gradle.kts).
      - uses: actions/setup-go@v7
        with:
          go-version-file: tunel/go.mod
          cache-dependency-path: tunel/go.sum

      - uses: gradle/actions/setup-gradle@v6

      - name: Chave de assinatura
        id: chave
        # Só na main, à mão: é a única execução que publica. Em outra branch a chave real nem é decodificada.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ASSINATURA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinatura.keystore"
            echo "ASSINATURA_ARQUIVO=$RUNNER_TEMP/assinatura.keystore" >> "$GITHUB_ENV"
            echo "tem_chave=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem o segredo ASSINATURA_KEYSTORE_B64: compila, mas não publica Release."
          fi

      # Página do GitHub em dia (20/11/2026, Paulo: "o repositório tem que receber as atualizações"): README, notas e
      # CHANGELOG saem do strings_versoes.xml e da lista de funções do site. Atrasados = não publica; o conserto é
      # rodar `python3 scripts/readme.py` e mesclar. Num "commit=" antigo o script não existe e o passo não faz nada.
      - name: Página do GitHub em dia
        run: '[ ! -f scripts/readme.py ] || python3 scripts/readme.py --check'

      # 62a: teste vermelho = não publica. 21.1: também em todo PR (teste vermelho = PR vermelho, sem compilar o APK).
      - name: Testes JVM
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Compilar o release
        env:
          # Segredos só no build que publica (manual, na main): PR e dispatch em outra branch compilam sem eles.
          ASSINATURA_SENHA: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.ASSINATURA_SENHA || '' }}
          ASSINATURA_ALIAS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.ASSINATURA_ALIAS || '' }}
          # Chaves dos aplicativos de filmes e séries (ServicosFilmes.kt): só no build que publica. Sem o secret, o
          # serviço some da tela (docs/servicos-filmes.md diz como criar cada uma).
          TMDB_CHAVE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.TMDB_CHAVE || '' }}
          TRAKT_ID: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.TRAKT_ID || '' }}
          TRAKT_SEGREDO: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.TRAKT_SEGREDO || '' }}
          SIMKL_ID: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.SIMKL_ID || '' }}
          OPENSUBTITLES_CHAVE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.OPENSUBTITLES_CHAVE || '' }}
          # Para onde vai o "Relatar um problema" (RelatarProblema.kt). Variável do repo, não secret: o e-mail aparece no QR.
          SUPORTE_EMAIL: ${{ vars.SUPORTE_EMAIL || '' }}
          PONTE: ${{ github.event_name == 'workflow_dispatch' && inputs.bridge || false }}
        run: |
          chmod +x gradlew
          # Ideia 101: o app de celular sai junto (mesma chave). Num "commit=" antigo sem a pasta celular/, só o launcher.
          if [ -d celular ]; then CEL=":celular:testReleaseUnitTest :celular:assembleRelease"; else CEL=""; fi
          # Um versionCode só para o app e a ponte (19/11/2026): a ponte reconhece o app novo do MESMO Release pela tag.
          CODIGO=$(( ($(date +%s) * 1000 - 1767225600000) / 60000 ))
          echo "VERSION_CODE=$CODIGO" >> "$GITHUB_ENV"
          SAIDA=app/build/outputs/apk/release
          mkdir -p publicar
          # Ponte (pacote antigo br.paulo.tvlauncher), só com bridge=true: passa o Device Owner e os ajustes da TV para o
          # app novo (PackageMigration.kt). Compila antes, porque o app novo usa a mesma pasta de saída.
          if [ "$PONTE" = "true" ]; then
            ./gradlew :app:assembleRelease -Plegacy -PversionCode=$CODIGO --no-daemon --stacktrace
            cp "$SAIDA/app-armeabi-v7a-release.apk" publicar/one-tv-launcher.apk
            cp "$SAIDA/app-arm64-v8a-release.apk" publicar/one-tv-launcher-arm64.apk
          fi
          # O app: tv.sofaly.launcher (decisão do Paulo, 19/11/2026: nenhum pacote público com o nome dele).
          ./gradlew :app:assembleRelease $CEL -PversionCode=$CODIGO --no-daemon --stacktrace
          cp "$SAIDA/app-armeabi-v7a-release.apk" publicar/sofaly-launcher.apk
          cp "$SAIDA/app-arm64-v8a-release.apk" publicar/sofaly-launcher-arm64.apk
          # APK de instalação (21/11/2026, SetupActivity.kt): sem acessibilidade e sem ouvinte de notificações, passa no
          # Play Protect quando vem do Downloader/site e traz a versão completa deste Release. versionCode N-1: a completa
          # (N) é uma atualização comum para ele. O Atualizador nunca o baixa (só procura sofaly-launcher*.apk).
          # Num "commit=" antigo, de antes do -Psetup, o Gradle ignoraria a opção e sairia o app completo com esse nome: só
          # com a pasta src/setup. Sem ela o Release sai sem o APK de instalação (o /download do site aponta para ele).
          if [ -d app/src/setup ]; then
            ./gradlew :app:assembleRelease -Psetup -PversionCode=$((CODIGO - 1)) --no-daemon --stacktrace
            cp "$SAIDA/app-armeabi-v7a-release.apk" publicar/sofaly-setup.apk
            cp "$SAIDA/app-arm64-v8a-release.apk" publicar/sofaly-setup-arm64.apk
          fi

      # Dois APKs (splits em app/build.gradle.kts), com o mesmo versionCode. NOME é o nome dos arquivos do Release
      # (o app tv.sofaly.launcher procura sofaly-launcher*.apk; a ponte antiga, one-tv-launcher*.apk).
      - name: Versão e SHA-256
        id: info
        run: |
          NOME=sofaly-launcher
          # App de celular: nome que NÃO começa com one-tv-launcher (o Atualizador da TV nunca o pega por engano).
          CEL=celular/build/outputs/apk/release/celular-release.apk
          if [ -f "$CEL" ]; then
            cp "$CEL" publicar/one-tv-celular.apk
            (cd publicar && sha256sum one-tv-celular.apk | cut -d' ' -f1 > one-tv-celular.apk.sha256)
          fi
          AAPT=$(ls "$ANDROID_HOME"/build-tools/36.0.0/aapt2)
          CODIGO=$("$AAPT" dump badging publicar/$NOME.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          C64=$("$AAPT" dump badging publicar/$NOME-arm64.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          if [ "$CODIGO" != "$C64" ]; then echo "::error::versionCode diferente: 32=$CODIGO 64=$C64"; exit 1; fi
          # Sem número lido, a tag sairia "v" e nenhuma TV atualizaria (Atualizador.kt lê o número da tag).
          if ! printf '%s' "$CODIGO" | grep -Eq '^[0-9]+$'; then echo "::error::versionCode não lido do APK"; exit 1; fi
          if [ "$CODIGO" != "$VERSION_CODE" ]; then echo "::error::versionCode $CODIGO, esperado $VERSION_CODE"; exit 1; fi
          APKS="$NOME.apk $NOME-arm64.apk"
          [ -f publicar/sofaly-setup.apk ] && APKS="$APKS sofaly-setup.apk sofaly-setup-arm64.apk"
          [ -f publicar/one-tv-launcher.apk ] && APKS="$APKS one-tv-launcher.apk one-tv-launcher-arm64.apk"
          for APK in $APKS; do
            # Pacote e versão certos em cada arquivo: o app nunca sai com o nome antigo, nem a ponte com o novo.
            PKG=$("$AAPT" dump badging "publicar/$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            VC=$("$AAPT" dump badging "publicar/$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            case "$APK" in one-tv-launcher*) ESPERADO=br.paulo.tvlauncher ;; *) ESPERADO=tv.sofaly.launcher ;; esac
            if [ "$PKG" != "$ESPERADO" ]; then echo "::error::$APK é $PKG, esperado $ESPERADO"; exit 1; fi
            case "$APK" in sofaly-setup*) VC_ESPERADO=$((CODIGO - 1)) ;; *) VC_ESPERADO=$CODIGO ;; esac
            if [ "$VC" != "$VC_ESPERADO" ]; then echo "::error::$APK versionCode $VC, esperado $VC_ESPERADO"; exit 1; fi
            # O de instalação não pode levar os serviços que o Play Protect bloqueia (src/setup/AndroidManifest.xml).
            case "$APK" in sofaly-setup*)
              if "$AAPT" dump xmltree --file AndroidManifest.xml "publicar/$APK" | grep -Eq 'BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE'; then
                echo "::error::$APK ainda declara acessibilidade ou ouvinte de notificações"; exit 1; fi ;;
            esac
            # Cada APK só pode ter as libs da própria arquitetura (confere o splits).
            unzip -l "publicar/$APK" | grep -o 'lib/[^/]*/' | sort -u | tr '\n' ' '; echo " <- $APK"
            # O compilarTunel só avisa quando o go build falha: aqui um Release sem o túnel (MCP pela internet) não sai.
            if [ -d tunel ] && ! unzip -l "publicar/$APK" | grep -q 'libtsnet.so'; then
              echo "::error::$APK saiu sem libtsnet.so (go build falhou?)"; exit 1; fi
            (cd publicar && sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256")
            echo "$APK  versionCode=$CODIGO  tamanho=$(stat -c%s "publicar/$APK") bytes  sha256=$(cat "publicar/$APK.sha256")"
          done
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          # Commit compilado de verdade (na republicação não é o GITHUB_SHA).
          COMMIT=$(git rev-parse HEAD)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          # Notas do Release (em inglês), com o número da build e o commit.
          sed -e "s/{BUILD}/$CODIGO/g" -e "s/{COMMIT}/${COMMIT::7}/g" .github/release-notes.md > publicar/notas.md
          # Números de leveza (degrau 2): tamanho dos APKs em tabela no fim das notas + leveza.json (asset; o site lê).
          # Num "commit=" anterior a 16/11 o script não existe: publica sem a tabela (o asset leveza.json fica de fora).
          [ -f scripts/numeros-leveza.py ] && python3 scripts/numeros-leveza.py publicar/$NOME.apk publicar/$NOME-arm64.apk "$CODIGO" publicar/leveza.json >> publicar/notas.md

      - uses: actions/upload-artifact@v7
        with:
          name: tv-launcher-${{ steps.info.outputs.codigo }}
          path: publicar/

  # Job separado só para ter a permissão de escrita (criar o Release) sem dá-la ao build nem aos PRs.
  publicar:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.build.outputs.tem_chave == '1'
    environment: espelho   # PUBLICO_TOKEN (só main, sem segunda aprovação: o build já foi aprovado)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # criar o Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tv-launcher-${{ needs.build.outputs.codigo }}

      - name: Publicar o Release
        env:
          # Código fechado (15/11/2026): o código fica num repo privado e o Release sai no repo PÚBLICO só de APKs,
          # que tem o nome que as TVs já leem (Config.ATUALIZACAO_REPO). Variável REPO_PUBLICO + segredo PUBLICO_TOKEN
          # (token com escrita em Contents só naquele repo). Sem a variável, publica no próprio repo, como antes.
          GH_TOKEN: ${{ vars.REPO_PUBLICO && secrets.PUBLICO_TOKEN || github.token }}
          DESTINO: ${{ vars.REPO_PUBLICO || github.repository }}
          V: ${{ needs.build.outputs.codigo }}
          NOME: ${{ needs.build.outputs.nome }}
          COMMIT: ${{ needs.build.outputs.commit }}
          CANAL: ${{ inputs.canal }}
        run: |
          # Sem checkout neste job: o repositório vai explícito. O download-artifact põe os arquivos de publicar/ aqui.
          # Canal "teste" = pré-lançamento (fora do /releases/latest). "todos" marca --latest explícito: o GitHub ordena o
          # "latest" pela data do COMMIT, e uma republicação (commit antigo) perderia para o Release anterior sem isso.
          if [ "$CANAL" = "teste" ]; then MARCA=--prerelease; else MARCA=--latest; fi
          # O commit só existe no repo do código: no repo público a tag nasce no main dele (o número vem da tag).
          if [ "$DESTINO" = "$GITHUB_REPOSITORY" ]; then ALVO_TAG="--target $COMMIT"; else ALVO_TAG=""; fi
          EXTRA=""; [ -f one-tv-celular.apk ] && EXTRA="one-tv-celular.apk one-tv-celular.apk.sha256"
          # Ponte (só com bridge=true): as TVs ainda em br.paulo.tvlauncher instalam a ponte e passam para o app novo.
          [ -f one-tv-launcher.apk ] && EXTRA="$EXTRA one-tv-launcher.apk one-tv-launcher.apk.sha256 one-tv-launcher-arm64.apk one-tv-launcher-arm64.apk.sha256"
          # APK de instalação (SetupActivity.kt): é o que o /download do site entrega ao Downloader.
          [ -f sofaly-setup.apk ] && EXTRA="$EXTRA sofaly-setup.apk sofaly-setup.apk.sha256 sofaly-setup-arm64.apk sofaly-setup-arm64.apk.sha256"
          [ -f leveza.json ] && EXTRA="$EXTRA leveza.json"
          gh release create "v$V" $MARCA \
            "$NOME.apk" "$NOME.apk.sha256" \
            "$NOME-arm64.apk" "$NOME-arm64.apk.sha256" $EXTRA \
            --repo "$DESTINO" \
            --title "One TV Launcher 1.0 (build $V)" \
            --notes-file notas.md \
            $ALVO_TAG
