# Publica site/ em sofaly.tv (Cloudflare Workers, só arquivos estáticos) a cada push na main que mexe no site.
# Precisa, uma vez: segredos CLOUDFLARE_API_TOKEN (modelo "Edit Cloudflare Workers") e CLOUDFLARE_ACCOUNT_ID.
# Sem os segredos o job é pulado (não falha).
name: Site sofaly.tv
on:
  push:
    branches: [main]
    paths: ['site/**', 'website/wrangler.toml', '.github/workflows/website.yml']
  workflow_dispatch:
concurrency:
  group: website
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: '22' }
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: website
        run: npx --yes wrangler@4 deploy
