# Publica a pasta site/ (página inicial, privacidade e termos) no GitHub Pages.
# Precisa, uma vez: Settings > Pages > Source = "GitHub Actions".
name: Paginas
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    # Com o código fechado (REPO_PUBLICO definido), o site é publicado pelo repo público (workflow "Repo publico").
    if: vars.REPO_PUBLICO == ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
