<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Box sign-in · One TV Launcher</title><link rel="stylesheet" href="estilo.css"></head>
<body><main>
<h1 id="titulo">Box</h1>
<p id="msg">Going back to your TV…<br><span class="data">Voltando para a sua TV…</span></p>
</main>
<!--
  Volta do login do Box para a TV (One TV Launcher, RetornoNuvem.kt). O Box só devolve o código para um endereço https;
  esta página só repassa o celular para a TV na rede de casa: http://<IP local>:<porto>/box?code=...&state=<número>.
  Não guarda nem envia nada a mais ninguém. O código vale 30 s e não serve sem o segredo do app, que só a TV tem.
  Só aceita IP de rede local (10.x, 172.16-31.x, 192.168.x), para não virar um redirecionador aberto.
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  function falha(en, pt) { msg.innerHTML = ''; msg.append(en, document.createElement('br')); var s = document.createElement('span'); s.className = 'data'; s.textContent = pt; msg.append(s); }
  var m = /^([0-9a-f]{32})_(\d{1,3}(?:\.\d{1,3}){3})_(\d{2,5})$/.exec(q.get('state') || '');
  if (!m) { falha('This link is not from your TV. Start again on the TV.', 'Este link não veio da sua TV. Comece de novo na TV.'); return; }
  var o = m[2].split('.').map(Number), porta = Number(m[3]);
  var local = o.every(function (n) { return n <= 255; }) &&
    (o[0] === 10 || (o[0] === 192 && o[1] === 168) || (o[0] === 172 && o[1] >= 16 && o[1] <= 31));
  if (!local || porta < 1024 || porta > 65535) { falha('This link is not from your TV. Start again on the TV.', 'Este link não veio da sua TV. Comece de novo na TV.'); return; }
  var volta = new URLSearchParams();
  volta.set('state', m[1]);
  if (q.get('code')) volta.set('code', q.get('code'));
  else volta.set('error', q.get('error') || 'sem_codigo');
  // Se o celular não estiver no Wi-Fi da TV, o endereço não abre: o texto abaixo fica na tela.
  setTimeout(function () { falha('If nothing happened: connect the phone to the same Wi-Fi as the TV and scan the QR again.', 'Se nada aconteceu: ligue o celular no mesmo Wi-Fi da TV e leia o QR de novo.'); }, 6000);
  location.replace('http://' + m[2] + ':' + porta + '/box?' + volta.toString());
})();
</script>
</body></html>
