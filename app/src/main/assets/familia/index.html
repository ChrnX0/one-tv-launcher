<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>📺</title>
<style>
  /* Família conectada (degrau 3, FamiliaConectada.kt). Página do link que os parentes recebem: sem conta, sem app.
     Tudo inline (a CSP do servidor não deixa carregar nada de fora). Letra grande: quem manda pode ser a avó também. */
  :root { color-scheme: light dark; --fundo: #f6f7f9; --cartao: #fff; --texto: #13161c; --fraco: #5b6474; --acento: #0b7a6a; --borda: #d8dce3; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0b0f17; --cartao: #151a24; --texto: #f2f4f8; --fraco: #98a1b3; --acento: #7fd6c2; --borda: #2a3140; } }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 19px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--fraco); }
  form { background: var(--cartao); border: 1px solid var(--borda); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
  label { font-weight: 600; display: grid; gap: 6px; }
  input[type=text], textarea { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--borda); background: transparent; color: inherit; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  .foto { display: grid; gap: 10px; }
  .foto img { max-width: 100%; border-radius: 12px; }
  button { font: inherit; font-weight: 600; min-height: 54px; border-radius: 14px; border: 0; cursor: pointer; }
  .principal { background: var(--acento); color: #fff; }
  @media (prefers-color-scheme: dark) { .principal { color: #0b0f17; } }
  .secundario { background: transparent; color: var(--acento); border: 2px solid var(--acento); }
  .msg { font-weight: 600; margin: 0; }
  .ok { color: var(--acento); }
  .erro { color: #c62828; }
</style>
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p id="sub"></p>
  <form id="form" autocomplete="on">
    <label><span id="lNome"></span><input type="text" id="nome" maxlength="30" autocomplete="name"></label>
    <label><span id="lTexto"></span><textarea id="texto" maxlength="200"></textarea></label>
    <div class="foto">
      <button type="button" class="secundario" id="btnFoto"></button>
      <input type="file" id="arquivo" accept="image/*" hidden>
      <img id="previa" alt="" hidden>
    </div>
    <button type="submit" class="principal" id="enviar"></button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
'use strict';
// en pt pt-PT es de fr it ru pl tr ja zh ko hi id ar (os mesmos 16 idiomas do app).
const T = {
  en: ["Send to the TV", "Your message and photo show up on the family TV right away.", "Your name", "Message", "Add a photo", "Change photo", "Send", "Sending…", "Sent! It is on the TV now.", "Write a message or add a photo.", "Too many sends today. Try again tomorrow.", "This link was turned off.", "That photo didn’t work. Try another one.", "It didn’t work. Check your internet and try again."],
  pt: ["Mandar para a TV", "Seu recado e sua foto aparecem na TV da família na hora.", "Seu nome", "Recado", "Pôr uma foto", "Trocar a foto", "Enviar", "Enviando…", "Enviado! Já está na TV.", "Escreva um recado ou ponha uma foto.", "Muitos envios hoje. Tente de novo amanhã.", "Este link foi desligado.", "Essa foto não deu certo. Tente outra.", "Não deu certo. Confira a internet e tente de novo."],
  "pt-PT": ["Enviar para a TV", "A sua mensagem e a sua foto aparecem logo na TV da família.", "O seu nome", "Mensagem", "Pôr uma foto", "Trocar a foto", "Enviar", "A enviar…", "Enviado! Já está na TV.", "Escreva uma mensagem ou ponha uma foto.", "Demasiados envios hoje. Tente amanhã.", "Este link foi desligado.", "Essa foto não funcionou. Tente outra.", "Não funcionou. Verifique a internet e tente de novo."],
  es: ["Enviar a la TV", "Tu mensaje y tu foto aparecen al momento en la TV de la familia.", "Tu nombre", "Mensaje", "Añadir una foto", "Cambiar la foto", "Enviar", "Enviando…", "¡Enviado! Ya está en la TV.", "Escribe un mensaje o añade una foto.", "Demasiados envíos hoy. Inténtalo mañana.", "Este enlace se desactivó.", "Esa foto no funcionó. Prueba con otra.", "No funcionó. Revisa internet e inténtalo de nuevo."],
  de: ["An den Fernseher senden", "Deine Nachricht und dein Foto erscheinen sofort auf dem Familienfernseher.", "Dein Name", "Nachricht", "Foto hinzufügen", "Foto ändern", "Senden", "Wird gesendet…", "Gesendet! Es ist jetzt auf dem Fernseher.", "Schreib eine Nachricht oder füge ein Foto hinzu.", "Zu viele Sendungen heute. Versuch es morgen.", "Dieser Link wurde ausgeschaltet.", "Dieses Foto ging nicht. Versuch ein anderes.", "Hat nicht geklappt. Prüfe das Internet und versuch es nochmal."],
  fr: ["Envoyer à la TV", "Votre message et votre photo s’affichent tout de suite sur la TV de la famille.", "Votre prénom", "Message", "Ajouter une photo", "Changer la photo", "Envoyer", "Envoi…", "Envoyé ! C’est sur la TV.", "Écrivez un message ou ajoutez une photo.", "Trop d’envois aujourd’hui. Réessayez demain.", "Ce lien a été désactivé.", "Cette photo n’a pas marché. Essayez-en une autre.", "Ça n’a pas marché. Vérifiez internet et réessayez."],
  it: ["Invia alla TV", "Il tuo messaggio e la tua foto compaiono subito sulla TV di famiglia.", "Il tuo nome", "Messaggio", "Aggiungi una foto", "Cambia foto", "Invia", "Invio…", "Inviato! È già sulla TV.", "Scrivi un messaggio o aggiungi una foto.", "Troppi invii oggi. Riprova domani.", "Questo link è stato disattivato.", "Quella foto non va. Provane un’altra.", "Non ha funzionato. Controlla internet e riprova."],
  ru: ["Отправить на телевизор", "Ваше сообщение и фото сразу появятся на семейном телевизоре.", "Ваше имя", "Сообщение", "Добавить фото", "Сменить фото", "Отправить", "Отправка…", "Отправлено! Уже на телевизоре.", "Напишите сообщение или добавьте фото.", "Сегодня слишком много отправок. Попробуйте завтра.", "Эта ссылка отключена.", "Это фото не подошло. Попробуйте другое.", "Не получилось. Проверьте интернет и попробуйте снова."],
  pl: ["Wyślij na telewizor", "Twoja wiadomość i zdjęcie od razu pojawią się na rodzinnym telewizorze.", "Twoje imię", "Wiadomość", "Dodaj zdjęcie", "Zmień zdjęcie", "Wyślij", "Wysyłanie…", "Wysłane! Już jest na telewizorze.", "Napisz wiadomość lub dodaj zdjęcie.", "Za dużo wysyłek dzisiaj. Spróbuj jutro.", "Ten link został wyłączony.", "To zdjęcie nie zadziałało. Spróbuj innego.", "Nie udało się. Sprawdź internet i spróbuj ponownie."],
  tr: ["TV’ye gönder", "Mesajınız ve fotoğrafınız hemen ailenin TV’sinde görünür.", "Adınız", "Mesaj", "Fotoğraf ekle", "Fotoğrafı değiştir", "Gönder", "Gönderiliyor…", "Gönderildi! Şimdi TV’de.", "Bir mesaj yazın veya fotoğraf ekleyin.", "Bugün çok fazla gönderim oldu. Yarın deneyin.", "Bu bağlantı kapatıldı.", "Bu fotoğraf olmadı. Başka birini deneyin.", "Olmadı. İnterneti kontrol edip tekrar deneyin."],
  ja: ["テレビに送る", "メッセージと写真がすぐに家族のテレビに表示されます。", "お名前", "メッセージ", "写真を追加", "写真を変更", "送信", "送信中…", "送信しました！テレビに表示されています。", "メッセージを書くか写真を追加してください。", "今日は送信が多すぎます。明日もう一度お試しください。", "このリンクは無効になりました。", "その写真は使えません。別の写真をお試しください。", "うまくいきませんでした。インターネットを確認して再度お試しください。"],
  zh: ["发送到电视", "你的留言和照片会立即显示在家里的电视上。", "你的名字", "留言", "添加照片", "更换照片", "发送", "正在发送…", "已发送！现在就在电视上。", "请写一条留言或添加一张照片。", "今天发送次数太多，请明天再试。", "此链接已关闭。", "这张照片不行，请换一张。", "没有成功。请检查网络后重试。"],
  ko: ["TV로 보내기", "메시지와 사진이 바로 가족 TV에 나타납니다.", "이름", "메시지", "사진 추가", "사진 바꾸기", "보내기", "보내는 중…", "보냈습니다! 지금 TV에 있어요.", "메시지를 쓰거나 사진을 추가하세요.", "오늘은 너무 많이 보냈어요. 내일 다시 시도하세요.", "이 링크는 꺼졌습니다.", "그 사진은 안 됩니다. 다른 사진을 시도하세요.", "실패했습니다. 인터넷을 확인하고 다시 시도하세요."],
  hi: ["TV पर भेजें", "आपका संदेश और फ़ोटो तुरंत परिवार के TV पर दिखेंगे।", "आपका नाम", "संदेश", "फ़ोटो जोड़ें", "फ़ोटो बदलें", "भेजें", "भेजा जा रहा है…", "भेज दिया! अब TV पर है।", "संदेश लिखें या फ़ोटो जोड़ें।", "आज बहुत बार भेजा गया। कल फिर कोशिश करें।", "यह लिंक बंद कर दिया गया है।", "यह फ़ोटो नहीं चली। कोई दूसरी आज़माएँ।", "नहीं हो पाया। इंटरनेट जाँचें और फिर कोशिश करें।"],
  id: ["Kirim ke TV", "Pesan dan foto Anda langsung muncul di TV keluarga.", "Nama Anda", "Pesan", "Tambah foto", "Ganti foto", "Kirim", "Mengirim…", "Terkirim! Sudah ada di TV.", "Tulis pesan atau tambahkan foto.", "Terlalu banyak kiriman hari ini. Coba lagi besok.", "Tautan ini sudah dimatikan.", "Foto itu tidak bisa. Coba foto lain.", "Tidak berhasil. Periksa internet lalu coba lagi."],
  ar: ["أرسل إلى التلفاز", "تظهر رسالتك وصورتك فورًا على تلفاز العائلة.", "اسمك", "رسالة", "أضف صورة", "غيّر الصورة", "إرسال", "جارٍ الإرسال…", "تم الإرسال! إنها على التلفاز الآن.", "اكتب رسالة أو أضف صورة.", "إرسالات كثيرة اليوم. حاول غدًا.", "تم إيقاف هذا الرابط.", "لم تنجح هذه الصورة. جرّب صورة أخرى.", "لم ينجح الأمر. تحقق من الإنترنت وحاول مرة أخرى."],
};
const K = ["titulo", "sub", "lNome", "lTexto", "foto", "trocar", "enviar", "enviando", "ok", "vazio", "limite", "desligado", "erroFoto", "rede"];
const pedido = (navigator.language || "en");
const curto = pedido.split("-")[0].toLowerCase();
const lang = T[pedido] ? pedido : (/^pt-(pt|ao|mz)$/i.test(pedido) ? "pt-PT" : (curto === "in" ? "id" : (T[curto] ? curto : "en")));
const t = Object.fromEntries(K.map((k, i) => [k, T[lang][i]]));
document.documentElement.lang = lang;
if (lang === "ar") document.documentElement.dir = "rtl";
document.title = t.titulo;
for (const id of ["titulo", "sub", "lNome", "lTexto"]) document.getElementById(id).textContent = t[id];
const $ = (id) => document.getElementById(id);
$("btnFoto").textContent = t.foto; $("enviar").textContent = t.enviar;
try { $("nome").value = localStorage.getItem("nome") || ""; } catch (e) {}
const base = location.pathname.replace(/\/+$/, "");
let foto = null;   // Blob JPEG já reduzido

$("btnFoto").addEventListener("click", () => $("arquivo").click());
$("arquivo").addEventListener("change", async () => {
  const f = $("arquivo").files[0];
  if (!f) return;
  try {
    foto = await reduzir(f);
    $("previa").src = URL.createObjectURL(foto); $("previa").hidden = false;
    $("btnFoto").textContent = t.trocar; mensagem("", "");
  } catch (e) { foto = null; mensagem(t.erroFoto, "erro"); }
});

/** A foto do celular (às vezes 12 MP) vira um JPEG de no máximo 1600 px: chega rápido e cabe no limite da TV. */
async function reduzir(arquivo) {
  const url = URL.createObjectURL(arquivo);
  try {
    const img = await new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = falha; i.src = url; });
    const escala = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * escala); c.height = Math.round(img.naturalHeight * escala);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok, falha) => c.toBlob((b) => b ? ok(b) : falha(new Error("toBlob")), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

function mensagem(texto, classe) { const m = $("msg"); m.textContent = texto; m.className = "msg " + classe; }

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const nome = $("nome").value.trim(), texto = $("texto").value.trim();
  if (!texto && !foto) { mensagem(t.vazio, "erro"); return; }
  try { localStorage.setItem("nome", nome); } catch (e) {}
  $("enviar").disabled = true; mensagem(t.enviando, "");
  try {
    const r = foto
      ? await fetch(base + "/foto?" + new URLSearchParams({ nome, texto }), { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: foto })
      : await fetch(base + "/recado", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome, texto }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      mensagem(t.ok, "ok");
      $("texto").value = ""; foto = null; $("previa").hidden = true; $("arquivo").value = ""; $("btnFoto").textContent = t.foto;
    } else mensagem({ limite: t.limite, desligado: t.desligado, foto: t.erroFoto, vazio: t.vazio }[j.erro] || t.rede, "erro");
  } catch (e) { mensagem(t.rede, "erro"); }
  finally { $("enviar").disabled = false; }
});
</script>
</body>
</html>
