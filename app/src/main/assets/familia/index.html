<html lang="en">

<meta charset="utf-8">

<title>📺</title>
<style>
  /* Família conectada (degrau 3, FamiliaConectada.kt). Página do link que os parentes recebem: sem conta, sem app.
     Tudo inline (a CSP do servidor não deixa carregar nada de fora). Letra grande: quem manda pode ser a avó também. */
  :root { color-scheme: light dark; --fundo: #f6f7f9; --cartao: #fff; --texto: #13161c; --fraco: #5b6474; --acento: #CE3D00; --borda: #d8dce3; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0b0f17; --cartao: #151a24; --texto: #f2f4f8; --fraco: #98a1b3; --acento: #FF6A2B; --borda: #2a3140; } }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 19px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--fraco); }
  form { background: var(--cartao); border: 1px solid var(--borda); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
  label { font-weight: 600; display: grid; gap: 6px; }
  input[type=text], textarea { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--borda); background: transparent; color: inherit; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  .foto { display: grid; gap: 10px; }
  .foto img, .foto video { max-width: 100%; border-radius: 12px; }
  button { font: inherit; font-weight: 600; min-height: 54px; border-radius: 14px; border: 0; cursor: pointer; }
  .principal { background: var(--acento); color: #fff; }
  @media (prefers-color-scheme: dark) { .principal { color: #0b0f17; } }
  .secundario { background: transparent; color: var(--acento); border: 2px solid var(--acento); }
  .msg { font-weight: 600; margin: 0; }
  .ok { color: var(--acento); }
  .erro { color: #c62828; }
  /* "❤ Vi" (17/11/2026): os últimos recados desta pessoa e se já foram vistos na TV. */
  #meus { margin-top: 22px; }
  #meus h2 { font-size: 20px; margin: 0 0 8px; }
  #meus ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #meus li { background: var(--cartao); border: 1px solid var(--borda); border-radius: 14px; padding: 10px 14px; display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
  #meus .resumo { overflow-wrap: anywhere; }
  #meus .estado { white-space: nowrap; font-weight: 600; color: var(--fraco); }
  #meus .visto { color: var(--acento); }
</style>
</head>

    </div>
    <button type="submit" class="principal" id="enviar"></button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <section id="meus" hidden><h2 id="meusTitulo"></h2><ul id="meusLista"></ul></section>

const lang = T[pedido] ? pedido : (/^pt-(pt|ao|mz)$/i.test(pedido) ? "pt-PT" : (curto === "in" ? "id" : (T[curto] ? curto : "en")));
const t = Object.fromEntries(K.map((k, i) => [k, T[lang][i]]));
const w = W[lang] || W.en;
const v = Object.fromEntries(["gravar", "regravar", "longo", "grande", "limiteVideo", "erroVideo", "videoDesligado", "enviandoVideo"].map((k, i) => [k, V[lang][i]]));
document.documentElement.lang = lang;
if (lang === "ar") document.documentElement.dir = "rtl";
document.title = t.titulo;
for (const id of ["titulo", "sub", "lNome", "lTexto"]) document.getElementById(id).textContent = t[id];
const $ = (id) => document.getElementById(id);
$("btnFoto").textContent = t.foto; $("enviar").textContent = t.enviar;
try { $("nome").value = localStorage.getItem("nome") || ""; } catch (e) {}
const base = location.pathname.replace(/\/+$/, "");
// Número aleatório deste celular (sem conta): vai junto de cada recado para a TV dizer depois se foi visto. Só este
// celular conhece o seu; sem localStorage (aba anônima) a lista simplesmente não aparece.
let rid = "";
try {
  rid = localStorage.getItem("remetente") || "";
  if (!/^[0-9a-f]{32}$/.test(rid)) {
    rid = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
    localStorage.setItem("remetente", rid);
  }
} catch (e) { rid = ""; }
function meusRecados() {
  if (!rid) return;
  fetch(base + "/vistos?" + new URLSearchParams({ rid })).then((r) => r.ok ? r.json() : null).then((j) => {
    const l = (j && j.recados) || [];
    $("meus").hidden = l.length === 0;
    $("meusTitulo").textContent = w[0];
    const ul = $("meusLista"); ul.textContent = "";
    for (const x of l.slice(0, 5)) {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.className = "resumo";
      const quando = new Date(x.quando).toLocaleString(document.documentElement.lang, { weekday: "short", hour: "2-digit", minute: "2-digit" });
      a.textContent = quando + " · " + x.resumo;
      const b = document.createElement("span"); b.className = "estado" + (x.visto ? " visto" : "");
      b.textContent = x.visto ? w[1] : w[2];
      li.append(a, b); ul.append(li);
    }
  }).catch(() => {});
}
meusRecados();
let foto = null;   // Blob JPEG já reduzido
let video = null;  // File do vídeo (até 30 s e 20 MB, conferido aqui e de novo na TV)
const MAX_S = 30, MAX_B = 20 * 1024 * 1024;

// A TV aceita vídeos? (opt-in de quem mora lá). Sem resposta, o botão fica escondido.
fetch(base + "/estado").then((r) => r.ok ? r.json() : {}).then((j) => {
  if (j && j.video) { $("btnVideo").textContent = v.gravar; $("btnVideo").hidden = false; }
}).catch(() => {});
$("btnVideo").addEventListener("click", () => $("arqVideo").click());
$("arqVideo").addEventListener("change", async () => {
  const f = $("arqVideo").files[0];
  video = null; $("previaVideo").hidden = true;
  if (!f) return;
  if (f.size > MAX_B) { mensagem(v.grande, "erro"); return; }
  const url = URL.createObjectURL(f);
  const dur = await new Promise((ok) => {
    const el = $("previaVideo");
    el.onloadedmetadata = () => ok(el.duration); el.onerror = () => ok(NaN); el.src = url;
  });
  // Duração desconhecida (alguns navegadores dão Infinity no WebM): a TV confere de novo.
  if (isFinite(dur) && dur > MAX_S + 1) { mensagem(v.longo, "erro"); return; }
  video = f; $("previaVideo").hidden = false; $("btnVideo").textContent = v.regravar; mensagem("", "");
  // Vídeo e foto não vão juntos: o vídeo ganha.
  foto = null; $("previa").hidden = true; $("arquivo").value = ""; $("btnFoto").textContent = t.foto;
});

/** Envia o vídeo cru (direto para o disco da TV), com a porcentagem na tela. */
function enviarVideo(nome, texto) {
  return new Promise((ok) => {
    const x = new XMLHttpRequest();
    x.open("POST", base + "/video?" + new URLSearchParams({ nome, texto, rid }));
    x.setRequestHeader("Content-Type", video.type || "video/mp4");
    x.upload.onprogress = (e) => { if (e.lengthComputable) mensagem(v.enviandoVideo.replace("%", Math.round(100 * e.loaded / e.total) + "%"), ""); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} ok({ ok: x.status === 200, erro: j.erro }); };
    x.onerror = () => ok({ ok: false, erro: "rede" });
    x.send(video);
  });
}

$("btnFoto").addEventListener("click", () => $("arquivo").click());
$("arquivo").addEventListener("change", async () => {
  const f = $("arquivo").files[0];
  if (!f) return;
  try {
    foto = await reduzir(f);
    if ($("previa").src.startsWith("blob:")) URL.revokeObjectURL($("previa").src);
    $("previa").src = URL.createObjectURL(foto); $("previa").hidden = false;
    $("btnFoto").textContent = t.trocar; mensagem("", "");
  } catch (e) { foto = null; mensagem(t.erroFoto, "erro"); }
});

/** A foto do celular (às vezes 12 MP) vira um JPEG de no máximo 1600 px: chega rápido e cabe no limite da TV. */
async function reduzir(arquivo) {
  const url = URL.createObjectURL(arquivo);
  try {
    const img = await new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = falha; i.src = url; });
    const escala = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * escala); c.height = Math.round(img.naturalHeight * escala);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok, falha) => c.toBlob((b) => b ? ok(b) : falha(new Error("toBlob")), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

function mensagem(texto, classe) { const m = $("msg"); m.textContent = texto; m.className = "msg " + classe; }

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const nome = $("nome").value.trim(), texto = $("texto").value.trim();
  if (!texto && !foto && !video) { mensagem(t.vazio, "erro"); return; }
  try { localStorage.setItem("nome", nome); } catch (e) {}
  $("enviar").disabled = true; mensagem(t.enviando, "");
  try {
    if (video) {
      const r = await enviarVideo(nome, texto);
      if (r.ok) {
        mensagem(t.ok, "ok");
        $("texto").value = ""; video = null; $("previaVideo").hidden = true; $("arqVideo").value = ""; $("btnVideo").textContent = v.gravar;
      } else mensagem({ limite: v.limiteVideo, desligado: v.videoDesligado, tamanho: v.grande, duracao: v.longo, video: v.erroVideo }[r.erro] || t.rede, "erro");
      return;
    }
    const r = foto
      ? await fetch(base + "/foto?" + new URLSearchParams({ nome, texto, rid }), { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: foto })
      : await fetch(base + "/recado", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome, texto, rid }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      mensagem(t.ok, "ok"); meusRecados();
      $("texto").value = ""; foto = null; $("previa").hidden = true; $("arquivo").value = ""; $("btnFoto").textContent = t.foto;
    } else mensagem({ limite: t.limite, desligado: t.desligado, foto: t.erroFoto, vazio: t.vazio }[j.erro] || t.rede, "erro");
  } catch (e) { mensagem(t.rede, "erro"); }
  finally { $("enviar").disabled = false; }
});
</script>
</body>
</html>
